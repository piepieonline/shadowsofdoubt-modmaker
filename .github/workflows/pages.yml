# Publish the app to GitHub Pages.
#
# Vite builds the site, so the deploy step uploads `dist/` rather than copying the repo.
# The build's `base` is the project path this is served under -- see vite.config.js -- and
# every asset URL is written against it, so the output is not servable from anywhere else.
#
# It is gated on the unit suite, which is what makes the difference here: the tests
# run on Linux and the site is served from Linux, while the app is developed on a
# case-insensitive filesystem. A `refs/` path whose case does not match the file on disk
# works locally and 404s once published, and nothing notices until something reads it.
#
# Playwright is deliberately not run here. It needs a browser download and a served app,
# takes six times as long on a runner as it does on a developer's machine, and several of
# its specs read a file straight after the click that writes it -- which is a race that
# only opens up on hardware this slow. Blocking a deploy on that is not worth it. Run
# `npm test` locally for the full suite.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that has started: a half-published site is
# worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vitest only. No browser to install and nothing to serve, so this is the whole job.
      - run: npm run test:unit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # What ships is whatever the build emits: the bundled shell and flows, the CSS and
      # fonts it references, and the reference data the flows fetch at runtime, which
      # vite.config.js copies in. There is no exclude list any more -- a build output
      # contains what it contains, which is the point of having one.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
